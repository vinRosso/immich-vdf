services:
  vdf-web:
    build: .
    ports:
      - "47821:47821"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD}
      PORT: "47821"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      MEDIA_ROOTS: /media
      IMMICH_LIBRARY: /immich
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-}
      VDF_CLI: /opt/vdf/vdf-cli
      NODE_ENV: production
    volumes:
      - ${MEDIA_PATH:?Set MEDIA_PATH}:/media
      - ${IMMICH_LIBRARY_PATH:?Set IMMICH_LIBRARY_PATH}:/immich:ro
      - vdf-data:/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:47821/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  vdf-data:
