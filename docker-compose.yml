# Local build of this checkout. Does not pull from Docker Hub.
# Users who only want the published image should start from docker-compose.example.yml.
services:
  immich-vdf:
    build: .
    image: immich-vdf:local
    pull_policy: build
    ports:
      - "4747:4747"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-}
      IMMICH_SCAN_ROOTS: ${IMMICH_SCAN_ROOTS:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-100}
    volumes:
      - vdf-data:/data
      - ${MEDIA_PATH:?Set MEDIA_PATH}:/media
      - ${IMMICH_PATH:?Set IMMICH_PATH}:/immich:ro
      # Extra libraries: same host:container path as Immich, read-only.
      # - /home/user/photos:/home/user/photos:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  vdf-data:
