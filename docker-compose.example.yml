# Copy this file to an empty directory as docker-compose.yml.
# It pulls the image GitHub Actions publishes. It does not build the source.
services:
  immich-vdf:
    image: vinrosso/immich-vdf:latest
    ports:
      - "4747:4747"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-}
      IMMICH_SCAN_ROOTS: ${IMMICH_SCAN_ROOTS:-}
    user: "1000:100"
    volumes:
      - ./data:/data
      - ${MEDIA_PATH:?Set MEDIA_PATH}:/media
      - ${IMMICH_PATH:?Set IMMICH_PATH}:/immich:ro
      # Extra libraries: same host:container path as Immich, read-only.
      # - /home/user/photos:/home/user/photos:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  vdf-data:
