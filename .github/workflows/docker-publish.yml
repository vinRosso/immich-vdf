name: Publish image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        shell: bash
        run: |
          set -eu
          image="${{ secrets.DOCKERHUB_USERNAME }}/immich-vdf"
          version=""
          minor=""
          major=""

          use_tag() {
            local name=$1
            if [[ "$name" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              major="${BASH_REMATCH[1]}"
              return 0
            fi
            return 1
          }

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            use_tag "$GITHUB_REF_NAME" || {
              echo "Git tag ${GITHUB_REF_NAME} must look like v0.1.0" >&2
              exit 1
            }
          else
            while IFS= read -r candidate; do
              if use_tag "$candidate"; then
                break
              fi
            done < <(git tag -l 'v*' --sort=-v:refname)
          fi

          {
            echo "tags<<EOF"
            if [[ -n "$version" ]]; then
              echo "${image}:${version}"
              echo "${image}:${minor}"
              echo "${image}:${major}"
            fi
            echo "${image}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [[ -n "$version" ]]; then
            echo "Publishing ${version}, ${minor}, ${major}, and latest"
          else
            echo "No vMAJOR.MINOR.PATCH git tag. Publishing latest only."
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}
