name: Publish image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # Check out the commit, not refs/tags/vX.Y.Z. A shallow fetch of that tag
      # ref fails with "Cannot fetch both <sha> and refs/tags/<tag>".
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        shell: bash
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/immich-vdf
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            export RELEASE_TAG="$GITHUB_REF_NAME"
            names=""
          else
            names=$(git ls-remote --tags --refs origin 'refs/tags/v*' | awk '{print $2}' | sed 's#refs/tags/##')
          fi
          tags=$(printf '%s\n' "$names" | node scripts/docker-image-tags.mjs "$IMAGE")
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}
