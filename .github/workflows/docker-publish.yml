name: Publish image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tag
        shell: bash
        run: |
          image="${{ secrets.DOCKERHUB_USERNAME }}/immich-vdf"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            printf 'value<<EOF\n%s:%s\n%s:latest\nEOF\n' "$image" "$version" "$image" >> "$GITHUB_OUTPUT"
          else
            printf 'value<<EOF\n%s:latest\nEOF\n' "$image" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.value }}
